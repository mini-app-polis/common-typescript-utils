name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # SEC-002 through SEC-005. Delegates to the fleet's shared security
  # workflow: gitleaks over full history, osv-scanner against
  # pnpm-lock.yaml, semgrep, and a CycloneDX SBOM retained as a build
  # artifact. The steps live in mini-app-polis/.github so the pinned tool
  # versions and the gating decisions are in one place; see that repo's
  # README for the inputs.
  #
  # No package-manager input: it selects how *Python* dependencies are
  # resolved before the audit and is ignored on this path, because
  # osv-scanner reads the committed lockfile directly.
  security:
    uses: mini-app-polis/.github/.github/workflows/security.yml@v2
    with:
      language: typescript

  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

  release:
    needs: [ci, security]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Inject secrets from Doppler
        uses: dopplerhq/secrets-fetch-action@v2.0.0
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
          doppler-project: mini-app-polis-ecosystem
          doppler-config: prd
          inject-env-vars: true

      # An empty NPM_TOKEN and an expired one both surface as the same
      # opaque `401 Unauthorized - GET /-/whoami` from npm, which points
      # at the registry when the problem may be that Doppler returned
      # nothing. Separate the two here, before semantic-release runs.
      # Length only -- never the value.
      - name: Verify NPM_TOKEN was injected
        env:
          NPM_TOKEN: ${{ env.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN is empty after the Doppler step. Check that the secret exists in project mini-app-polis-ecosystem, config prd, under exactly that name, and that DOPPLER_TOKEN is valid. This is not an npm problem."
            exit 1
          fi
          echo "NPM_TOKEN injected (${#NPM_TOKEN} chars). If npm still returns 401, the token itself is expired, revoked, or lacks publish rights."

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install semantic-release plugins
        run: pnpm add --save-dev @semantic-release/changelog @semantic-release/git @semantic-release/github @semantic-release/npm @semantic-release/commit-analyzer @semantic-release/release-notes-generator

      - name: Build
        run: pnpm build

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
        run: npx semantic-release
