name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # SEC-002: Secret scanning on pull-request diffs using gitleaks.
      # Runs early: fast, deterministic, and a leaked credential should stop
      # the build before anything else is worth looking at.
      - name: Scan for secrets (PR diffs)
        if: github.event_name == 'pull_request'
        uses: gitleaks/gitleaks-action@v2
        with:
          source: diff
          verbose: true

      # SEC-002: Full gitleaks scan on push to main
      - name: Scan for secrets (full history)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: gitleaks/gitleaks-action@v2
        with:
          verbose: true

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      # SEC-003: Dependency vulnerability scanning, split by blast radius.
      #
      # These run last because `pnpm audit` calls the npm registry over the
      # network on every invocation. A registry timeout is not a reason to
      # withhold typecheck, lint and test results.
      #
      # Hard gate on runtime dependencies only. This package publishes dist/
      # with zod as its sole runtime dependency, so anything flagged here
      # actually reaches consumers and is worth blocking a release for.
      - name: Audit runtime dependencies
        run: pnpm audit --prod --audit-level=moderate

      # Report-only on the full tree. Dev-only findings arrive through eslint
      # and semantic-release, ship to nobody, and are frequently not fixable
      # by upgrading — current eslint still resolves a flagged brace-expansion.
      # Failing merges on them would leave CI permanently red, which teaches
      # everyone to ignore it. Surfaced here to be read, not to gate.
      - name: Audit all dependencies (informational)
        continue-on-error: true
        run: pnpm audit --audit-level=moderate

  release:
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Inject secrets from Doppler
        uses: dopplerhq/secrets-fetch-action@v2.0.0
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
          doppler-project: mini-app-polis-ecosystem
          doppler-config: prd
          inject-env-vars: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install semantic-release plugins
        run: pnpm add --save-dev @semantic-release/changelog @semantic-release/git @semantic-release/github @semantic-release/npm @semantic-release/commit-analyzer @semantic-release/release-notes-generator

      - name: Build
        run: pnpm build

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
        run: npx semantic-release
